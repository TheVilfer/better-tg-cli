name: Release

# Push a tag vX.Y.Z (scripts/release.sh does it) to publish that version everywhere:
# GitHub Release with standalone binaries and the Claude Desktop extension → npm (OIDC trusted
# publishing) → Homebrew tap → MCP Registry.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - id: v
        name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Claude Desktop extension
        run: node scripts/mcpb.mjs release/better-tg-cli.mcpb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: release/better-tg-cli.mcpb
          if-no-files-found: error

  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          # macOS binaries are built on macOS so they can be ad-hoc signed
          - { os: macos-latest, target: darwin-arm64, smoke: true }
          - { os: macos-latest, target: darwin-x64, smoke: false }
          - { os: ubuntu-latest, target: linux-x64, smoke: true }
          - { os: ubuntu-latest, target: linux-arm64, smoke: false }
          # Built on Windows so the exe gets its version resource; run again in windows-smoke
          - { os: windows-latest, target: windows-x64, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/build-binary.sh "$TARGET" release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
      - name: Smoke test (native targets)
        if: matrix.smoke
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir smoke && tar -xJf release/*.tar.xz -C smoke
          test "$(./smoke/telegram --version)" = "$VERSION"
          ./smoke/telegram help-all -g thread | grep -q 'read <chat>'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  windows-smoke:
    needs: [verify, binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-windows-x64
          path: release
      - name: Run telegram.exe
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TG_NO_UPDATE_CHECK: '1'
        run: |
          Expand-Archive -Path (Get-ChildItem release/*.zip).FullName -DestinationPath smoke
          $v = & ./smoke/telegram.exe --version
          if ($v -ne $env:VERSION) { throw "version $v != $env:VERSION" }
          if (-not ((& ./smoke/telegram.exe help-all -g thread) -match 'read <chat>')) { throw 'help-all failed' }
          $info = (Get-Item smoke/telegram.exe).VersionInfo
          if ($info.ProductName -ne 'better-tg-cli' -or $info.ProductVersion -ne "$env:VERSION.0") {
            throw "version resource: '$($info.ProductName)' '$($info.ProductVersion)'"
          }

  github-release:
    needs: [verify, binaries, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: release
      - name: Checksums
        run: cd release && sha256sum *.tar.xz *.zip *.mcpb > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "better-tg-cli $GITHUB_REF_NAME" \
            --generate-notes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: release/SHA256SUMS

  npm:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance; no NPM_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - name: Publish (skipped if this version is already on npm)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "better-tg-cli@$VERSION" version >/dev/null 2>&1; then
            echo "better-tg-cli@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi

  homebrew:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: .
      - name: Render formula
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/homebrew-formula.mjs "$VERSION" SHA256SUMS > better-tg-cli.rb
      - name: Push to TheVilfer/homebrew-tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:TheVilfer/homebrew-tap.git tap
          mkdir -p tap/Formula && cp better-tg-cli.rb tap/Formula/better-tg-cli.rb
          cd tap
          git config user.name "better-tg-cli release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/better-tg-cli.rb
          git diff --cached --quiet && { echo "Formula unchanged"; exit 0; }
          git commit -m "better-tg-cli $VERSION"
          git push origin HEAD

  scoop:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: .
      - name: Render manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/scoop-manifest.mjs "$VERSION" SHA256SUMS > better-tg-cli.json
      - name: Push to TheVilfer/scoop-bucket
        env:
          SCOOP_DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SCOOP_DEPLOY_KEY" > ~/.ssh/scoop_key && chmod 600 ~/.ssh/scoop_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/scoop_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:TheVilfer/scoop-bucket.git bucket
          mkdir -p bucket/bucket && cp better-tg-cli.json bucket/bucket/better-tg-cli.json
          cd bucket
          git config user.name "better-tg-cli release"
          git config user.email "actions@users.noreply.github.com"
          git add bucket/better-tg-cli.json
          git diff --cached --quiet && { echo "Manifest unchanged"; exit 0; }
          git commit -m "better-tg-cli $VERSION"
          git push origin HEAD

  mcp-registry:
    # Lists the MCP server on registry.modelcontextprotocol.io (name io.github.TheVilfer/better-tg-cli).
    # The registry checks mcpName in the published npm package, so wait until npm serves it.
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry; no token stored
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PUBLISHER: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for npm to serve this version
        # npm keeps a fresh version in validation for up to about an hour before serving it
        run: |
          for i in $(seq 1 150); do
            [ "$(npm view "better-tg-cli@$VERSION" mcpName 2>/dev/null)" = "io.github.TheVilfer/better-tg-cli" ] && exit 0
            sleep 30
          done
          echo "::error::better-tg-cli@$VERSION did not appear on npm within 75 minutes"; exit 1
      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$base/registry_${PUBLISHER#v}_checksums.txt" | grep ' mcp-publisher_linux_amd64.tar.gz$' | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          test "$(jq -r .version server.json)" = "$VERSION"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
