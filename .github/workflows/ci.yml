name: CI

# next collects merged pull requests; main is the last stable release (scripts/release.sh)
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]


permissions:
  contents: read

# A new push to a pull request cancels its older run; pushes to main and next always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: API coverage (reachability/Telethon >= 90%, dedicated command per method = 100%)
        # Fails if TL-method reachability or Telethon 1.45.0 TelegramClient accounting drops below
        # 90%, if any TL method lacks a generated `telegram <namespace> <method>` command (100%
        # gate), or if docs/api-coverage.md is stale. Threshold: --min / API_COVERAGE_MIN.
        run: npm run coverage:api
      # Offline tests only: no Telegram session or network is ever used in CI
      - run: npm test
      - name: Versioned files match package.json
        # package.json is the only place the version is edited; gen-version copies it everywhere else
        run: |
          node scripts/gen-version.mjs
          git diff --exit-code || { echo '::error::Run "node scripts/gen-version.mjs" and commit the result'; exit 1; }

  windows:
    # Windows: DPAPI secret store, PowerShell dialogs, backslash paths, .cmd shims
    runs-on: windows-latest
    steps:
      # Real-time scanning of every file npm and the tests write is the slowest part of a Windows runner
      - run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # The bundle only: the test job on Linux already typechecks
      - run: node scripts/gen-version.mjs && bun scripts/bundle.mjs node
      - run: npm test
      - name: Smoke test the CLI
        shell: bash
        env:
          TG_NO_UPDATE_CHECK: '1'
        run: |
          node dist/telegram.mjs --version
          node dist/telegram.mjs help-all -g onboard | grep -q onboard
          node dist/telegram.mjs skill status | grep -q claude-code

  windows-exe:
    # The standalone telegram.exe, in parallel with the Windows tests above
    runs-on: windows-latest
    steps:
      - run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Build and run the standalone telegram.exe
        shell: bash
        env:
          TG_NO_UPDATE_CHECK: '1'
        run: |
          scripts/build-binary.sh windows-x64 out
          mkdir smoke && pwsh -NoProfile -Command "Expand-Archive -Path (Get-ChildItem out/*.zip).FullName -DestinationPath smoke"
          ./smoke/telegram.exe --version
          ./smoke/telegram.exe help-all -g thread | grep -q 'read <chat>'
          ./smoke/telegram.exe skill status | grep -q claude-code
      - name: Check the exe version resource
        shell: pwsh
        run: |
          $info = (Get-Item smoke/telegram.exe).VersionInfo
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($info.ProductName -ne 'better-tg-cli' -or $info.ProductVersion -ne "$version.0") {
            throw "version resource: '$($info.ProductName)' '$($info.ProductVersion)'"
          }
