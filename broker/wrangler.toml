name = "tg-cli-broker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
# No request/response logging: bodies carry invite tokens and the api_hash
observability = { enabled = false }

# kv_namespaces is filled in by `wrangler kv namespace create INVITES`
[[kv_namespaces]]
binding = "INVITES"
id = "4320febbafa14fa19579bcda05c8aebc"

# 5 credential requests per minute per IP (logins are rare; this only slows abuse)
[[ratelimits]]
name = "LIMITER"
namespace_id = "7001"
simple = { limit = 5, period = 60 }

# Self-serve signup page (src/signup.ts): 6 requests per minute per IP across both steps (code
# request and code check), separate from credentials
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "7002"
simple = { limit = 6, period = 60 }

# Signup codes go out through Cloudflare Email Sending. Until MAIL_FROM is set to an address on a
# domain onboarded to Email Service, signups stay closed (see src/signup.ts).
[[send_email]]
name = "EMAIL"

[vars]
SIGNUP_DAILY_CAP = "30"
# Turnstile widget "better-tg-cli invites" (public); TURNSTILE_SECRET is a secret
TURNSTILE_SITE_KEY = "0x4AAAAAAFGjz6sghgDCcgsK"
