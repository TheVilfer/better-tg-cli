name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # tg-plugin build bundles with Bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: dist/plugin.js is committed and matches the source
        # plugin install fetches the files of a commit, so the built code must be in the repository
        run: git diff --exit-code dist/plugin.js || { echo '::error::Run "npm run build" and commit dist/plugin.js'; exit 1; }
      - run: npm run typecheck
      - name: telegram plugin validate
        run: |
          npm install -g better-tg-cli
          telegram plugin validate .
      - name: Mock tests (no Telegram, no network)
        run: npm test
